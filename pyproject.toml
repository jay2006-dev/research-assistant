[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "asterline-research-assistant"
version = "0.1.0"
description = "AI-powered research assistant"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.7",
    "uvicorn[standard]>=0.34",
    "fastapi>=0.115",
    "streamlit>=1.41",
    "chromadb>=0.6",
    "sentence-transformers>=3.3",
]

[project.scripts]
asterline = "asterline.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
]

# src-layout: importable packages live under src/
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_model: Real model smoke tests requiring sentence-transformers weight download and execution (run separately)",
]

[tool.ruff]
src = ["src"]
line-length = 100
